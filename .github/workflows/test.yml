name: Run Test

on:
  workflow_call:

env:
  CONFIGURATION: 'Release'
  DOTNET_VERSION: '10.0.x'
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6.0.0
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Nerdbank.GitVersioning
      uses: dotnet/nbgv@v0.5.2
      id: nbgv

    - name: Cache NuGet Packages
      if: matrix.os == 'windows-latest'
      uses: actions/cache@v6.1.0
      with:
        path: ${{ env.NUGET_PACKAGES }}
        key: ${{ runner.os }}-dotnet-${{ env.DOTNET_VERSION }}-nuget-${{ hashFiles('global.json', 'NuGet.Config', 'Directory.Build.props', '**/*.csproj') }}

    - name: Restore
      run: dotnet restore neo-express.sln

    - name: Format
      if: matrix.os == 'ubuntu-latest'
      run: dotnet format neo-express.sln --verify-no-changes --no-restore --verbosity diagnostic

    - name: Build
      run: dotnet build neo-express.sln --configuration ${{ env.CONFIGURATION }} --no-restore --verbosity normal

    - name: Test
      run: dotnet test neo-express.sln --configuration ${{ env.CONFIGURATION }} --no-build --verbosity normal --filter "Category!=Integration"

    - name: Pack for Install
      run: dotnet pack neo-express.sln --configuration ${{ env.CONFIGURATION }} --output ./out --no-build --verbosity normal

    - name: Install neodebug tool
      run: dotnet tool install --add-source ./out --verbosity normal --global --version ${{ steps.nbgv.outputs.NuGetPackageVersion }} neo.debug

    - name: Test Version Command (neodebug)
      run: neodebug --version

    - name: Install neoxp tool
      run: dotnet tool install --add-source ./out --verbosity normal --global --version ${{ steps.nbgv.outputs.NuGetPackageVersion }} neo.express

    - name: Test Create Command (neoxp)
      run: neoxp create --force

    - name: Test Checkpoint Command (offline) (neoxp)
      run: neoxp checkpoint create checkpoints/init --force

    - name: Test Policy Command (offline) (neoxp)
      shell: bash
      run: |
        neoxp policy get --json > local-policy.json
        neoxp policy sync local-policy --account genesis

    - name: Test Wallet Command (neoxp)
      run: |
        neoxp wallet create bob --force

    - name: Test Transfer Command (offline) (neoxp)
      run: |
        neoxp transfer 10000 gas genesis node1
        neoxp transfer 10000 gas genesis bob

    - name: Test Run Command (online) (neoxp)
      # Probe RPC directly: show state can use offline storage during startup
      # and observe the mutex before the RPC server is accepting connections.
      shell: bash
      timeout-minutes: 2
      run: |
        neoxp run --seconds-per-block 3 --discard > neoxp-node.log 2>&1 &
        NODE_PID=$!
        READY=0
        for _ in $(seq 1 30); do
          if ! kill -0 "$NODE_PID" 2>/dev/null; then
            cat neoxp-node.log
            exit 1
          fi
          if curl --silent --fail --max-time 1 \
            --header 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"getversion","params":[]}' \
            http://127.0.0.1:50012 > neoxp-rpc.json \
            && grep -Eq '"result"[[:space:]]*:[[:space:]]*[{]' neoxp-rpc.json; then
            READY=1
            break
          fi
          sleep 1
        done
        if [ "$READY" != "1" ]; then
          echo "neo-express RPC did not become ready within 60 seconds"
          cat neoxp-node.log
          exit 1
        fi
        cat neoxp-node.log
        neoxp show state

    - name: Test Transfer Command (online) (neoxp)
      run: |
        neoxp transfer 10000 gas genesis node1
        neoxp transfer 10000 gas genesis bob

    - name: Test Stop Command (online) (neoxp)
      run: neoxp stop --all

  integration:
    # The unit-test job filters out Category=Integration, so the checkpoint
    # restore, online node and recovery workflows have no CI coverage unless
    # they run here. Redirect HOME to a workspace directory so the tool's
    # default ~/.neo-express location stays isolated from the runner user.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6.0.0
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore
      run: dotnet restore neo-express.sln

    - name: Build
      run: dotnet build neo-express.sln --configuration ${{ env.CONFIGURATION }} --no-restore --verbosity normal

    - name: Run Integration Tests
      env:
        HOME: ${{ github.workspace }}/.integration-home
      run: |
        mkdir -p "$HOME"
        dotnet test neo-express.sln --configuration ${{ env.CONFIGURATION }} --no-build --verbosity normal --filter "Category=Integration"
